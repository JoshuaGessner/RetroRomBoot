name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test host tooling and runtime scripts
        run: make check
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-test installed wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          romboot platforms

  registry-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run security-focused tests
        run: python -m unittest -v tests.test_core.SecurityTests tests.test_core.BiosTests tests.test_core.ConfigTests tests.test_core.FlashSafetyTests

  buildroot-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate pinned Buildroot configuration
        run: |
          git clone --depth 1 --branch 2025.02.16 https://gitlab.com/buildroot.org/buildroot.git "$RUNNER_TEMP/buildroot"
          test "$(git -C "$RUNNER_TEMP/buildroot" rev-parse HEAD)" = "135af563b945b8c3d18f8fd370370075b9edb140"
          make -C "$RUNNER_TEMP/buildroot" O="$RUNNER_TEMP/output" BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" romboot_rpi4_defconfig
          grep -q '^BR2_PACKAGE_ROMBOOT_RETROARCH=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_PACKAGE_ROMBOOT_LIBRETRO_FCEUMM=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_PACKAGE_ROMBOOT_LIBRETRO_SNES9X2010=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_PACKAGE_ROMBOOT_LIBRETRO_GENESIS_PLUS_GX=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_PACKAGE_ROMBOOT_LIBRETRO_GAMBATTE=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_PACKAGE_ROMBOOT_LIBRETRO_MGBA=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_PACKAGE_ROMBOOT_LIBRETRO_BEETLE_PCE_FAST=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_TARGET_ROOTFS_SQUASHFS=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_PACKAGE_PSPLASH=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_TOOLCHAIN_BUILDROOT_MUSL=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_PACKAGE_RPI_FIRMWARE_VARIANT_PI4_CD=y$' "$RUNNER_TEMP/output/.config"
          ! grep -q '^BR2_PACKAGE_RPI_FIRMWARE_INSTALL_DTB_OVERLAYS=y$' "$RUNNER_TEMP/output/.config"
          ! grep -q '^BR2_PACKAGE_ALSA_UTILS=y$' "$RUNNER_TEMP/output/.config"
          grep -q '^BR2_SYSTEM_DHCP=""$' "$RUNNER_TEMP/output/.config"
          ! grep -q '^BR2_TARGET_GENERIC_GETTY=y$' "$RUNNER_TEMP/output/.config"
          ! grep -q '^BR2_PACKAGE_DROPBEAR=y$' "$RUNNER_TEMP/output/.config"
          ! grep -q '^BR2_PACKAGE_OPENSSH=y$' "$RUNNER_TEMP/output/.config"
