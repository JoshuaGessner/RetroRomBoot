# Raspberry Pi firmware boots partition 1; the kernel mounts partition 2 as a
# read-only SquashFS root.  Partition 3 is the only persistent writable state.
image boot.vfat {
	vfat {
		label = "ROMBOOT-BT"
		files = {
			"Image",
			"bcm2711-rpi-4-b.dtb",
			"config.txt",
			"cmdline.txt",
			"fixup4cd.dat",
			"start4cd.elf"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		image = "boot.vfat"
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.squashfs"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
