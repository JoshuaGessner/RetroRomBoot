# Raspberry Pi firmware boots partition 1; the kernel mounts partition 2 as a
# read-only SquashFS root.  Partition 3 is the only persistent writable state.
# The Zero 2 W (BCM2837) loads bootcode.bin from the FAT partition, which the
# Pi 4 does not use.
image boot.vfat {
	vfat {
		label = "ROMBOOT-BT"
		files = {
			"Image",
			"bcm2710-rpi-zero-2-w.dtb",
			"config.txt",
			"cmdline.txt",
			"bootcode.bin",
			"fixup.dat",
			"start.elf",
			"overlays"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		image = "boot.vfat"
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.squashfs"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
