# Read-only release configuration for the single-game NES MVP.
config_save_on_exit = "false"
video_driver = "gl"
audio_driver = "alsa"
input_driver = "udev"
# USB controllers are auto-mapped from RetroArch's bundled joypad autoconfig
# profiles (package romboot-joypad-autoconfig). Any controller with a known
# vendor/product id is configured on connect - no per-device binding needed.
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig/udev"
# Robustness: also let a left analog stick drive the D-pad. Movement then works
# whether a pad reports its directions on the D-pad or on an analog axis/stick.
input_player1_analog_dpad_mode = "1"
input_player2_analog_dpad_mode = "1"
video_fullscreen = "true"
video_vsync = "true"
video_aspect_ratio_auto = "true"
video_scale_integer = "true"
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_reset_btn = "3"
quit_press_twice = "true"
